[package]
name = "sc-scraping"
version = "0.2.1"
edition = "2024"
description = "Utility functions and structures to scrape data from the Roberts Space Industries website"
homepage = "https://github.com/devnought/sc-scraping"
keywords = ["star", "citizen", "rsi"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/devnought/sc-scraping"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
jiff = { version = "0.2.23", features = ["serde"] }
scraper = "0.26.0"
serde = { version = "1.0.228 ", features = ["derive"] }
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
