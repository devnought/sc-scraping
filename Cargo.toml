[package]
name = "sc-scraping"
version = "0.2.0"
edition = "2024"
description = "Utility functions and structures to scrape data from the Roberts Space Industries website"
homepage = "https://github.com/devnought/sc-scraping"
keywords = ["star", "citizen", "rsi"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/devnought/sc-scraping"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = "0.4.29"
scraper = "0.26.0"
serde = { version = "1.0.228 ", features = ["derive"] }
url = { version = "2.5.8", features = ["serde"] }
jiff = { version = "0.2.23", features = ["serde"] }
